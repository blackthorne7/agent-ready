# Deploys main to the live Unikraft instance on every merge: a new image, and env vars from the repo
# secrets (Supabase, Omnara, Context.dev, Stripe). Needs the UNIKRAFT_TOKEN repo secret and the
# UNIKRAFT_ORG, UNIKRAFT_INSTANCE and UNIKRAFT_SERVICE repo variables (AGENT_DAILY_BUDGET is optional).
# The first run creates the service (https://<UNIKRAFT_SERVICE>.sfo.unikraft.app) and the instance.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a merge during a deploy waits for it, then deploys the newer main.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  ORG: ${{ vars.UNIKRAFT_ORG }}
  INSTANCE: ${{ vars.UNIKRAFT_INSTANCE }}
  SERVICE: ${{ vars.UNIKRAFT_SERVICE }}
  IMAGE: ${{ vars.UNIKRAFT_ORG }}/agent-ready
  SITE: https://${{ vars.UNIKRAFT_SERVICE }}.sfo.unikraft.app
  UNIKRAFT_CLI_VERSION: 0.6.2

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Type-checking and lint run inside the image build (next build); the unit tests don't.
      - name: Unit tests
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm test

      - name: Install the Unikraft CLI
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://unikraft.com/cli/install.sh \
            | UNIKRAFT_CLI_INSTALL_VERSION="v$UNIKRAFT_CLI_VERSION" UNIKRAFT_CLI_INSTALL_BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Log in to Unikraft
        env:
          UNIKRAFT_TOKEN: ${{ secrets.UNIKRAFT_TOKEN }}
        run: |
          test -n "$UNIKRAFT_TOKEN" || { echo "::error::Add the UNIKRAFT_TOKEN repository secret"; exit 1; }
          test -n "$ORG" -a -n "$INSTANCE" -a -n "$SERVICE" \
            || { echo "::error::Set the UNIKRAFT_ORG, UNIKRAFT_INSTANCE and UNIKRAFT_SERVICE repository variables"; exit 1; }
          mkdir -p ~/.config/unikraft
          umask 077
          cat > ~/.config/unikraft/config.yaml <<EOF
          profiles:
            agent-ready:
              type: cloud
              token: $UNIKRAFT_TOKEN
              organization: $ORG
              metros:
                - name: sfo
                  endpoint: https://api.sfo.unikraft.cloud
          profile: agent-ready
          EOF

      - name: Build and push the image
        run: |
          TAG="$IMAGE:${GITHUB_SHA::12}"
          unikraft build . --output "$TAG"
          DIGEST=$(unikraft images list -o json | jq -r --arg ref "$TAG" '.[] | select(.ref == $ref) | .digest' | head -1)
          test -n "$DIGEST" || { echo "::error::Pushed $TAG but couldn't find its digest"; exit 1; }
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "Built $TAG ($DIGEST)"

      # The instance's env is set from the repo secrets on every deploy, so rotating a key means
      # updating the secret and re-running this workflow. The first run creates the service and instance.
      # Image and env edits only apply to a stopped instance; if the edit fails, it starts again as it was.
      - name: Deploy the instance
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          OMNARA_TOKEN: ${{ secrets.OMNARA_TOKEN }}
          OMNARA_ORG_ID: ${{ secrets.OMNARA_ORG_ID }}
          OMNARA_PROJECT_ID: ${{ secrets.OMNARA_PROJECT_ID }}
          OMNARA_MODEL: ${{ secrets.OMNARA_MODEL }}
          CONTEXT_DEV_API_KEY: ${{ secrets.CONTEXT_DEV_API_KEY }}
          LOGOLINK_CLIENT_ID: ${{ secrets.LOGOLINK_CLIENT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          AGENT_DAILY_BUDGET: ${{ vars.AGENT_DAILY_BUDGET }}
        run: |
          args=(-e HOSTNAME=0.0.0.0 -e PORT=3000 -e NODE_ENV=production -e AGENT_RUNTIME=omnara
                -e OMNARA_MODEL="${OMNARA_MODEL:-anthropic/claude-sonnet-5.5}" -e SITE_URL="$SITE")
          for k in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
                   OMNARA_TOKEN OMNARA_ORG_ID OMNARA_PROJECT_ID CONTEXT_DEV_API_KEY LOGOLINK_CLIENT_ID STRIPE_SECRET_KEY; do
            if [ -n "${!k}" ]; then args+=(-e "$k=${!k}"); else echo "::warning::$k secret not set; left out"; fi
          done
          [ -n "$AGENT_DAILY_BUDGET" ] && args+=(-e "AGENT_DAILY_BUDGET=$AGENT_DAILY_BUDGET")

          if unikraft instances get "$INSTANCE" -o yaml | grep -E '^\s*(image|state):'; then
            unikraft instances stop "$INSTANCE"
            trap 'unikraft instances start "$INSTANCE" || true' EXIT
            # -e replaces the instance's whole env with these values.
            unikraft instances edit "$INSTANCE" --image "$IMAGE@$DIGEST" "${args[@]}"
            trap - EXIT
            unikraft instances start "$INSTANCE"
          else
            unikraft services get "$SERVICE" >/dev/null 2>&1 \
              || unikraft services create --metro sfo --name "$SERVICE" --domain "$SERVICE" --service 443:3000/tls+http
            unikraft run --metro sfo --name "$INSTANCE" -m 1024M --set service="$SERVICE" "${args[@]}" --image "$IMAGE@$DIGEST"
          fi
          unikraft instances get "$INSTANCE" -o yaml | grep -E '^\s*(image|state):'

      - name: Check the live site
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$SITE/") || true
            [ "$code" = 200 ] && { echo "Live: $SITE"; exit 0; }
            sleep 2
          done
          echo "::error::$SITE returned $code after the deploy"
          exit 1
